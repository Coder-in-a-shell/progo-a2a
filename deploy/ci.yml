name: CI

on:
  push:
    branches: [ master, main, feat/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests with race detector
        run: go test -v -race ./...

      - name: Run throughput benchmarks
        run: go test -bench=. -benchmem ./tests/...

      - name: Build binary
        run: go build -v -o bin/progo-a2a ./cmd/proxy
