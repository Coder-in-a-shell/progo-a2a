site_name: ProGoA2A
site_description: High-performance, framework-agnostic Agent-to-Agent (A2A) proxy in Go.
site_author: Sudhir Jaiswal (Coder-in-a-shell)
site_url: https://coder-in-a-shell.github.io/progo-a2a/
repo_url: https://github.com/Coder-in-a-shell/progo-a2a
repo_name: Coder-in-a-shell/progo-a2a
edit_uri: edit/master/docs/
exclude_docs: |
  superpowers/

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Coder-in-a-shell/progo-a2a

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart Tutorial: getting-started/quickstart.md
  - Core Concepts:
      - Architecture: concepts/architecture.md
      - A2A Protocol Scope: concepts/a2a-protocol.md
      - Translation Engine: concepts/translation-engine.md
      - Routing & Resilience: concepts/routing-resilience.md
      - Real-Time Streaming: concepts/streaming.md
  - Configuration:
      - Overview: configuration/index.md
      - YAML Reference: configuration/reference.md
      - Security & RBAC: configuration/security-rbac.md
  - Adapters & Frameworks:
      - Overview: adapters/index.md
      - LangGraph: adapters/langgraph.md
      - CrewAI: adapters/crewai.md
      - AutoGen: adapters/autogen.md
      - OpenAI: adapters/openai.md
      - Custom Webhooks: adapters/custom-webhooks.md
  - API Reference:
      - Overview: api/index.md
      - A2A-Inspired Endpoints: api/a2a-endpoints.md
      - Direct REST Endpoints: api/rest-endpoints.md
      - Observability & Metrics: api/observability.md
  - Production & Deployment:
      - Docker & Compose: deployment/docker.md
      - PostgreSQL Storage: deployment/postgresql.md
      - Kubernetes: deployment/kubernetes.md
      - Production Checklist: deployment/production-checklist.md
